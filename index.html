const payAlloc=(sid,amt)=>run(async()=>{const d=S.du.filter(x=>x.studentId==sid&&x.paid<x.amount&&x.week<=curW()).sort((a,b)=>a.week-b.week),ar=d.reduce((s,x)=>s+x.amount-x.paid,0);if(!(amt>0)||amt>ar)return toast('Nominal harus 1 sampai '+rp(ar));const b=D.batch();let r=amt;for(const x of d){if(r<=0)break;const t=Math.min(r,x.amount-x.paid);r-=t;b.update(D.doc('weeklyDues/'+x.id),{paid:INC(t),paidAt:TS});b.set(D.collection('weeklyPayments').doc(),{dueId:x.id,studentId:sid,studentEmail:x.studentEmail,week:x.week,amount:t,createdAt:TS});txd(b,{pos:'CASH_MAIN',type:'IN',kind:'kas',amount:t,name:x.name,studentEmail:x.studentEmail,week:x.week,note:'Kas minggu '+x.week})}aud(b,'bayar_kas',{studentId:sid,amount:amt});await b.commit();toast('Pembayaran dicatat');const e=$('#pa');if(e)e.value=''});

const mkBill=()=>run(async()=>{const n=$('#bn').value.trim(),a=+$('#ba').value,t=$('#bt').value,due=$('#bd').value,rs=$('#br').value;let l=S.st.filter(s=>s.active!==false);if(!n||!(a>0))return toast('Isi nama dan nominal');if(t=='L'||t=='P')l=l.filter(s=>s.gender==t);if(t=='M'){const ck=[...document.querySelectorAll('[id^=mc_]:checked')].map(x=>x.id.slice(3));l=l.filter(s=>ck.includes(s.id))}if(!l.length)return toast('Tidak ada siswa terpilih');const r=D.collection('specialBills').doc(),b=D.batch();b.set(r,{name:n,reason:rs,desc:$('#bx').value,amount:a,target:t,due,status:'Aktif',createdAt:TS});l.forEach(s=>b.set(D.collection('specialBillMembers').doc(),{billId:r.id,billName:n,reason:rs,dueDate:due,amount:a,paid:0,studentId:s.id,studentEmail:(s.email||'').toLowerCase(),studentName:s.name,createdAt:TS}));aud(b,'buat_tagihan',{billId:r.id});await b.commit();S.m=0;toast('Tagihan dibuat')});

const savePay=()=>run(async()=>{const adm=S.admin,sid=adm?$('#q_s').value:S.me.id,s=adm?stu(sid):S.me,a=Math.round(+$('#q_a').value),em=(s.email||'').toLowerCase();if(!s.name)return toast('Pilih siswa');if(!(a>0))return toast('Isi nominal pembayaran');if(!em)return toast('Email siswa belum diisi di data siswa');

b.set(ref,{studentId:sid,studentEmail:em,studentName:s.name,no:s.no,amount:a,kind:k,week:k=='kas'&&$('#q_w').value?+$('#q_w').value:null,app:$('#q_x').value,ref:$('#q_f').value.trim(),note:$('#q_n').value.trim(),payDate:$('#q_d').value,payTime:$('#q_t').value,status:st,proof:!!Q.img,src:adm?'admin':'siswa',by:U.email,createdAt:TS,log:[{s:st,by:U.email,at:Date.now(),n:'Dicatat'}]});

const addProof=async(el,id)=>{const f=el.files[0];if(!f)return;try{const img=await pic(f,1100,.7);if(img.length>600000)return toast('Bukti terlalu besar');const p=S.qp.find(x=>x.id==id);run(async()=>{const b=D.batch();b.set(D.doc('qrisProofs/'+id),{studentEmail:p.studentEmail,img,by:U.email,createdAt:TS});b.update(D.doc('qrisPayments/'+id),{proof:true,...(p.status=='menunggu_bukti'?{status:'menunggu_verifikasi'}:{}),log:AU({s:'bukti',by:U.email,at:Date.now(),n:'Bukti ditambahkan'})});await b.commit();Q.pv[id]=img;toast('Bukti tersimpan')})}catch(e){toast(e.message)}};
function qdM(id){const x=S.qp.find(p=>p.id==id);if(!x)return'';const adm=S.admin,pr=Q.pv[id],dr=(a,b)=>b?`<div class="item"><span class="sm">${a}</span><b style="text-align:right;font-size:.85rem">${b}</b></div>`:'';
return`<div class="row"><div class="g1"><h2>${esc(x.studentName)}</h2><p class="sm">Absen ${pad(x.no)}</p></div>${qchip(x.status)}<button class="btn s" onclick="cm()" aria-label="Tutup">${ic('x')}</button></div>
<div style="margin-top:12px">${dr('ID',id.slice(0,8))}${dr('Jenis',x.kind=='kas'?'Kas mingguan'+(x.week?' (minggu '+x.week+')':''):'Pembayaran lain')}${dr('Nominal dilaporkan',rp(x.amount))}${dr('Nominal terverifikasi',x.verifiedAmount!=null?rp(x.verifiedAmount):'')}${dr('Tanggal bayar',esc(((x.payDate||'')+' '+(x.payTime||'')).trim()))}${dr('Aplikasi asal',esc(x.app))}${dr('Referensi',esc(x.ref))}${dr('Dicatat',fdd(x.createdAt)+' oleh '+esc(x.by))}${dr('Diverifikasi',x.verifiedAt?fdd(x.verifiedAt)+' oleh '+esc(x.verifiedBy):'')}${dr('Catatan',esc(x.note))}${dr('Catatan verifikasi',esc(x.verifyNote))}${dr('Alasan',esc(x.reason))}${dr('Dialokasikan ke',(x.alloc||[]).map(a=>'Minggu '+a.week+' '+rp(a.amt)).join(', '))}${x.unalloc>0?dr('Kelebihan belum dialokasikan',rp(x.unalloc)):''}</div>
<p class="sm" style="margin-top:8px">Alokasi ke transfer kas utama tidak dilacak per pembayaran. Lihat status transfer pada saldo QRIS.</p>
${x.proof?(pr?(pr=='x'?'<p class="sm">Bukti tidak bisa dimuat.</p>':`<img class="pf" src="${pr}" alt="Bukti pembayaran">`):`<button class="btn w" style="margin-top:12px" onclick="showProof('${id}')">Lihat bukti pembayaran</button>`):(adm?`<label class="btn w" style="margin-top:12px;cursor:pointer">Tambah bukti<input type="file" accept="image/*" hidden onchange="addProof(this,'${id}')"></label>`:'<p class="sm" style="margin-top:12px">Belum ada bukti.</p>')}
<h3>Riwayat status</h3>${(x.log||[]).map(l=>`<div class="hi"><b>${esc(l.s)}</b><p class="sm">${new Date(l.at).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})} - ${esc(l.by)}${l.n?' - '+esc(l.n):''}</p></div>`).join('')}
${adm&&PEND.includes(x.status)?`<div class="stack" style="margin-top:16px"><button class="btn p w" onclick="verifyPay('${id}')">Verifikasi dana masuk</button><div class="row w"><button class="btn" onclick="setPayS('${id}','perlu_pemeriksaan')">Perlu pemeriksaan</button><button class="btn dn" onclick="setPayS('${id}','ditolak')">Tolak</button></div></div>`:''}${adm&&x.status=='terverifikasi'?`<button class="btn dn w" style="margin-top:16px" onclick="voidPay('${id}')">Batalkan verifikasi (koreksi)</button>`:''}`}
const setPayS=async(id,s)=>{const v=await ask({t:s=='ditolak'?'Tolak pembayaran':'Tandai perlu pemeriksaan',m:'Saldo tidak akan bertambah.',f:[{k:'r',l:'Alasan (wajib)',req:1}],ok:'Simpan',dn:s=='ditolak'});if(!v)return;run(async()=>{const b=D.batch();b.update(D.doc('qrisPayments/'+id),{status:s,reason:v.r,log:AU({s,by:U.email,at:Date.now(),n:v.r})});aud(b,'qris_'+s,{id,reason:v.r});await b.commit();S.m=0;toast('Status diperbarui')})};
const verifyPay=async id=>{const p=S.qp.find(x=>x.id==id),v=await ask({t:'Verifikasi dana masuk',m:p.studentName+' melaporkan '+rp(p.amount)+'. Pastikan dana benar-benar sudah masuk di akun QRIS, lalu isi nominal yang diterima.',f:[{k:'a',l:'Nominal yang diterima (Rp)',type:'number',v:p.amount,req:1},{k:'f',l:'Referensi transaksi (opsional)',v:p.ref||''},{k:'n',l:'Catatan (wajib jika nominal berbeda)'}],ok:'Verifikasi dana masuk'});if(!v)return;const a=Math.round(+v.a);if(!(a>0))return toast('Nominal tidak valid');if(a!=p.amount&&!(v.n||'').trim())return toast('Nominal berbeda dari laporan. Isi catatan penjelasan.');
run(async()=>{const out=await D.runTransaction(async t=>{const pr=D.doc('qrisPayments/'+id),cur=(await t.get(pr)).data();if(!cur||!PEND.includes(cur.status))throw new Error('Pembayaran ini sudah diproses.');
const ds=cur.kind=='kas'?S.du.filter(x=>x.studentId==cur.studentId&&x.paid<x.amount&&x.week<=curW()).sort((x,y)=>(x.week==cur.week?-1:y.week==cur.week?1:0)||x.week-y.week):[],fr2=await Promise.all(ds.map(d=>t.get(D.doc('weeklyDues/'+d.id))));let rest=a;const al=[];fr2.forEach(s=>{const x=s.data();if(!x||rest<=0)return;const need=x.amount-(x.paid||0);if(need<=0)return;const u=Math.min(rest,need);rest-=u;al.push({dueId:s.id,week:x.week,amt:u,sid:x.studentId,em:x.studentEmail})});
t.update(pr,{status:'terverifikasi',verifiedAmount:a,verifiedBy:U.email,verifiedAt:TS,verifyRef:v.f||'',verifyNote:(v.n||'').trim(),alloc:al.map(x=>({dueId:x.dueId,week:x.week,amt:x.amt})),unalloc:cur.kind=='kas'?rest:0,log:AU({s:'terverifikasi',by:U.email,at:Date.now(),n:'Dana diterima '+rp(a)})});
t.set(D.doc('transactions/qp_'+id),{pos:QP,type:'IN',kind:'qris',amount:a,name:cur.studentName,studentEmail:cur.studentEmail,note:'Pembayaran QRIS '+cur.studentName,ref:id,by:U.email,createdAt:TS});
al.forEach(x=>{t.update(D.doc('weeklyDues/'+x.dueId),{paid:INC(x.amt),qris:INC(x.amt),paidAt:TS});t.set(D.collection('weeklyPayments').doc(),{dueId:x.dueId,studentId:x.sid,studentEmail:x.em,week:x.week,amount:x.amt,method:'QRIS',ref:id,createdAt:TS})});
t.set(D.collection('auditLogs').doc(),{by:U.email,action:'qris_verifikasi',id,amount:a,reported:cur.amount,createdAt:TS});return rest});S.m=0;toast(out>0&&p.kind=='kas'?'Terverifikasi. Kelebihan '+rp(out)+' belum dialokasikan':'Terverifikasi. Saldo QRIS bertambah '+rp(a))})};
const voidPay=async id=>{const p=S.qp.find(x=>x.id==id),a=p.verifiedAmount,m=qsum();if(m.free<a)return ask({t:'Tidak bisa dibatalkan',m:'Dana '+rp(a)+' sudah dipindahkan atau dipakai, saldo QRIS yang tersedia hanya '+rp(m.free)+'. Membatalkan sekarang akan membuat saldo fiktif. Selesaikan dulu transfer yang berjalan, atau catat penyesuaian secara terpisah.',ok:'Mengerti'});
const v=await ask({t:'Batalkan verifikasi',m:p.studentName+', '+rp(a)+'. Saldo QRIS berkurang dan pembayaran siswa ditarik kembali.',f:[{k:'r',l:'Alasan (wajib)',req:1}],ok:'Batalkan verifikasi',dn:1});if(!v)return;
run(async()=>{await D.runTransaction(async t=>{const pr=D.doc('qrisPayments/'+id),cur=(await t.get(pr)).data();if(!cur||cur.status!='terverifikasi')throw new Error('Status pembayaran sudah berubah.');const al=cur.alloc||[],fr2=await Promise.all(al.map(x=>t.get(D.doc('weeklyDues/'+x.dueId))));
t.update(pr,{status:'dibatalkan',reason:v.r,log:AU({s:'dibatalkan',by:U.email,at:Date.now(),n:v.r})});t.set(D.doc('transactions/qpv_'+id),{pos:QP,type:'OUT',kind:'qris_koreksi',amount:cur.verifiedAmount,name:cur.studentName,studentEmail:cur.studentEmail,note:'Koreksi QRIS: '+v.r,ref:id,by:U.email,createdAt:TS});
al.forEach((x,i)=>{const d=fr2[i].data();t.update(D.doc('weeklyDues/'+x.dueId),{paid:INC(-x.amt),qris:INC(-x.amt)});t.set(D.collection('weeklyPayments').doc(),{dueId:x.dueId,studentId:d.studentId,studentEmail:d.studentEmail,week:x.week,amount:-x.amt,method:'QRIS',kind:'koreksi',ref:id,createdAt:TS})});t.set(D.collection('auditLogs').doc(),{by:U.email,action:'qris_batal',id,amount:cur.verifiedAmount,reason:v.r,createdAt:TS})});S.m=0;toast('Verifikasi dibatalkan')})};
function qtfM(){const m=qsum();return`<div class="row"><h2>Transfer ke Kas Utama</h2><button class="btn s" onclick="cm()" aria-label="Tutup">${ic('x')}</button></div><p class="sm" style="margin-top:6px">Saldo QRIS bisa dipakai ${rp(m.free)}. Ini hanya mencatat transfer yang kamu lakukan di luar aplikasi.</p><label for="q_ta">Nominal (Rp)</label><input id="q_ta" type="number" inputmode="numeric"><label for="q_ts">Nama pengirim</label><input id="q_ts" value="${esc(U.displayName||'')}"><label for="q_tr">Nama penerima (bendahara)</label><input id="q_tr" value="${esc(S.cfg.treasurer||'')}"><label for="q_tm">Metode transfer</label><select id="q_tm">${['DANA','GoPay','SeaBank','Bank','Tunai'].map(a=>`<option>${a}</option>`).join('')}</select><label for="q_td">Rekening atau dompet tujuan</label><input id="q_td"><label for="q_tf">Referensi transfer (opsional)</label><input id="q_tf"><label for="q_tn">Catatan</label><input id="q_tn"><button class="btn p w" style="margin-top:16px" onclick="saveTf()">Ajukan transfer</button>`}
const saveTf=()=>run(async()=>{const m=qsum(),a=Math.round(+$('#q_ta').value),s=$('#q_ts').value.trim(),r=$('#q_tr').value.trim();if(!(a>0))return toast('Isi nominal');if(a>m.free)return toast('Melebihi saldo tersedia '+rp(m.free));if(!s||!r)return toast('Isi nama pengirim dan penerima');const ref=D.collection('qrisTransfers').doc(),b=D.batch();b.set(ref,{amount:a,from:QP,to:'CASH_MAIN',status:'diajukan',sender:s,receiver:r,method:$('#q_tm').value,dest:$('#q_td').value.trim(),ref:$('#q_tf').value.trim(),note:$('#q_tn').value.trim(),by:U.email,createdAt:TS,log:[{s:'diajukan',by:U.email,at:Date.now(),n:''}]});aud(b,'qris_transfer_ajukan',{id:ref.id,amount:a});await b.commit();S.m=0;toast('Diajukan. Dana belum dianggap diterima kas utama')});
function qtdM(id){const t=S.qt.find(x=>x.id==id);if(!t)return'';const u=isUtama(),dr=(a,b)=>b?`<div class="item"><span class="sm">${a}</span><b style="text-align:right;font-size:.85rem">${b}</b></div>`:'';
return`<div class="row"><div class="g1"><h2>${rp(t.amount)}</h2><p class="sm">QRIS ke kas utama</p></div>${qchip(t.status,TSL)}<button class="btn s" onclick="cm()" aria-label="Tutup">${ic('x')}</button></div><div style="margin-top:12px">${dr('ID',id.slice(0,8))}${dr('Pengirim',esc(t.sender))}${dr('Penerima',esc(t.receiver))}${dr('Metode',esc(t.method))}${dr('Tujuan',esc(t.dest))}${dr('Referensi',esc(t.ref))}${dr('Diajukan',fdd(t.createdAt)+' oleh '+esc(t.by))}${dr('Dikirim',t.sentAt?fdd(t.sentAt)+' oleh '+esc(t.sentBy):'')}${dr('Diterima',t.doneAt?fdd(t.doneAt)+' oleh '+esc(t.receivedBy):'')}${dr('Catatan',esc(t.note))}</div><h3>Riwayat</h3>${(t.log||[]).map(l=>`<div class="hi"><b>${esc(l.s)}</b><p class="sm">${new Date(l.at).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})} - ${esc(l.by)}${l.n?' - '+esc(l.n):''}</p></div>`).join('')}
${t.status=='diajukan'?`<div class="stack" style="margin-top:16px"><button class="btn p w" onclick="trAct('${id}','send')">Tandai dana sudah dikirim</button><button class="btn dn w" onclick="trAct('${id}','cancel')">Batalkan pengajuan</button></div>`:''}${t.status=='dikirim'?`<div class="stack" style="margin-top:16px">${u?`<button class="btn p w" onclick="trAct('${id}','recv')">Konfirmasi dana sudah diterima</button>`:'<p class="sm">Menunggu konfirmasi Bendahara Utama.</p>'}<button class="btn dn w" onclick="trAct('${id}','fail')">Tandai gagal, dana kembali</button></div>`:''}`}
const trAct=async(id,act)=>{const t0=S.qt.find(x=>x.id==id),T2={send:['Dana sudah dikirim?','Dana '+rp(t0.amount)+' keluar dari saldo QRIS dan masuk Dana dalam proses sampai bendahara mengonfirmasi.'],recv:['Konfirmasi dana diterima','Pastikan '+rp(t0.amount)+' benar-benar sudah masuk ke bendahara. Kas utama bertambah dan transfer selesai.'],fail:['Transfer gagal','Dana '+rp(t0.amount)+' dikembalikan ke saldo QRIS.'],cancel:['Batalkan pengajuan','Belum ada dana yang keluar dari saldo.']}[act],need=act=='fail'||act=='cancel',v=await ask({t:T2[0],m:T2[1],f:need?[{k:'r',l:'Alasan (wajib)',req:1}]:[],ok:'Lanjutkan',dn:need});if(!v)return;
if(act=='recv'&&!isUtama())return toast('Hanya Bendahara Utama yang bisa mengonfirmasi');
run(async()=>{await D.runTransaction(async tr=>{const ref=D.doc('qrisTransfers/'+id),c=(await tr.get(ref)).data(),r=v.r||'',st={send:'diajukan',recv:'dikirim',fail:'dikirim',cancel:'diajukan'}[act];if(!c||c.status!=st)throw new Error('Status transfer sudah berubah.');const ns={send:'dikirim',recv:'selesai',fail:'gagal',cancel:'dibatalkan'}[act],lg=AU({s:ns,by:U.email,at:Date.now(),n:r}),base={ref:id,by:U.email,createdAt:TS,studentEmail:''};
if(act=='send'){tr.update(ref,{status:ns,sentAt:TS,sentBy:U.email,log:lg});tr.set(D.doc('transactions/qt_'+id+'_out'),{...base,pos:QP,type:'OUT',kind:'transfer_keluar',amount:c.amount,name:'Transfer ke Kas Utama',note:'Dikirim ke '+c.receiver})}
if(act=='recv'){tr.update(ref,{status:ns,doneAt:TS,receivedBy:U.email,log:lg});tr.set(D.doc('transactions/qt_'+id+'_in'),{...base,pos:'CASH_MAIN',type:'IN',kind:'transfer',amount:c.amount,name:'Transfer Masuk dari QRIS',note:'Dari '+c.sender})}
if(act=='fail'){tr.update(ref,{status:ns,failReason:r,log:lg});tr.set(D.doc('transactions/qt_'+id+'_back'),{...base,pos:QP,type:'IN',kind:'pembalikan',amount:c.amount,name:'Pembalikan transfer gagal',note:r})}
if(act=='cancel')tr.update(ref,{status:ns,log:lg});tr.set(D.collection('auditLogs').doc(),{by:U.email,action:'qris_transfer_'+act,id,amount:c.amount,reason:r,createdAt:TS})});S.m=0;toast('Berhasil')})};
const qexM=()=>`<div class="row"><h2>Pengeluaran langsung QRIS</h2><button class="btn s" onclick="cm()" aria-label="Tutup">${ic('x')}</button></div><p class="sm" style="margin-top:6px">Saldo QRIS bisa dipakai ${rp(qsum().free)}. Ini bukan transfer ke kas utama.</p><label for="q_en">Nama pengeluaran</label><input id="q_en"><label for="q_ea">Nominal (Rp)</label><input id="q_ea" type="number" inputmode="numeric"><label for="q_ec">Kategori</label><select id="q_ec"><option>Perlengkapan kelas</option><option>Kegiatan</option><option>Lainnya</option></select><label for="q_ep">Penerima dana</label><input id="q_ep"><label for="q_er">Alasan (wajib)</label><input id="q_er"><button class="btn p w" style="margin-top:16px" onclick="saveQEx()">Catat pengeluaran</button>`;

const qrcM=()=>`<div class="row"><h2>Rekonsiliasi saldo QRIS</h2><button class="btn s" onclick="cm()" aria-label="Tutup">${ic('x')}</button></div><p class="sm" style="margin-top:6px">Saldo menurut ClassCash ${rp(bal(QP))}. Isi saldo yang terlihat di aplikasi akun QRIS sekarang. Aplikasi tidak mengubah saldo untuk menutupi selisih.</p><label for="q_rc">Saldo menurut akun penerima (Rp)</label><input id="q_rc" type="number" inputmode="numeric"><label for="q_rn">Catatan</label><input id="q_rn"><button class="btn p w" style="margin-top:16px" onclick="saveRc()">Simpan pemeriksaan</button>`;

return[{t:'Ringkasan QRIS',h:['Keterangan','Nilai'],r:[['Pemasukan terverifikasi (bersih)',rp(m.inn)],['Transfer ke kas utama (terkirim)',rp(m.tf)],['Pengeluaran langsung',rp(m.ex)],['Dana dalam proses transfer',rp(m.proc)],['Saldo QRIS menurut pembukuan',rp(m.bl)],['Total gabungan dana kelas',rp(m.all)]]},{t:'Pembayaran QRIS',h:['Tanggal','Siswa','Nominal','Status'],r:S.qp.filter(inM).sort(byNew).map(x=>[fdd(x.createdAt),pad(x.no)+' '+x.studentName,rp(x.verifiedAmount??x.amount),(QS[x.status]||[x.status])[0]])},{t:'Transfer ke kas utama',h:['Tanggal','Nominal','Status','Penerima'],r:S.qt.filter(inM).sort(byNew).map(t=>[fdd(t.createdAt),rp(t.amount),(TSL[t.status]||[t.status])[0],t.receiver])},{t:'Pengeluaran langsung QRIS',h:['Tanggal','Keterangan','Nominal'],r:S.tx.filter(t=>t.pos==QP&&t.kind=='pengeluaran_qris'&&inM(t)).sort(byNew).map(t=>[fdd(t.createdAt),t.name+' - '+t.note,rp(t.amount)])}]}
