<style>

.lk{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}.lk a{color:var(--p);cursor:pointer;font-weight:600}.sec{text-align:center;margin-top:18px}

:focus-visible{outline:2px solid var(--p);outline-offset:2px}

aside button{flex-direction:row;flex:none;font-size:14px;padding:12px 14px;gap:12px;justify-content:flex-start}aside .x{display:flex}.mo{display:none}
.md{border-radius:28px;align-self:center}.ov{align-items:center}.sqg{grid-template-columns:repeat(6,1fr)}
.lg{grid-template-columns:1.1fr 1fr}.bp{display:flex;flex-direction:column;justify-content:center;gap:24px;padding:60px;background:linear-gradient(150deg,#3b21c9,#5b3df5 55%,#14b8c4);color:#fff}.bp h1{font-size:34px;max-width:420px}.bp p{opacity:.88;max-width:380px}.fc .logo{display:none}
}
</style></head>
<body><div id="app"></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyDHVMX37Y843qesiunSbbk2kaw0uP6TGTg",authDomain:"classcash-web.firebaseapp.com",projectId:"classcash-web",storageBucket:"classcash-web.firebasestorage.app",messagingSenderId:"212206166910",appId:"1:212206166910:web:3d4e5f8c5b40c6fad9492f"});
const A=firebase.auth(),D=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp(),INC=firebase.firestore.FieldValue.increment;
const app=document.getElementById('app'),$=s=>document.querySelector(s),AMT=5000,DAY=864e5;
const rp=n=>'Rp'+(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={home:'<path d="M3 11 12 3l9 8v10H3z"/>',users:'<circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1M16 4a4 4 0 0 1 0 8M22 21v-1a6 6 0 0 0-4-5.6"/>',wallet:'<rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20M16 15h2"/>',tag:'<path d="M20 12 12 20 4 12V4h8z"/><circle cx="8" cy="8" r="1"/>',out:'<path d="M7 17 17 7M8 7h9v9"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',lo:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="m15 6-6 6 6 6"/>',chev:'<path d="m9 6 6 6-6 6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',wa:'<path d="M4 20l1.5-4.5A8 8 0 1 1 8.5 18.5z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
function toast(m){const t=document.createElement('div');t.className='toast glass';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)}
const stt=x=>x.paid>=x.amount?'Lunas':x.paid>0?'Cicilan':'Belum bayar';
const chip=x=>`<span class="chip ${x.paid>=x.amount?'ok':x.paid>0?'wr':'er'}">${stt(x)}</span>`;
let U=null,busy=0,un=[],R=new Set(),L='in',inited=0,ens=0,S={tab:'dash',cfg:{},st:[],du:[],sb:[],mb:[],tx:[],m:0};
const run=async f=>{if(busy)return;busy=1;try{await f()}catch(e){toast(e.code==='permission-denied'?'Ditolak oleh aturan keamanan':e.message)}finally{busy=0}};
const aud=(b,action,x)=>b.set(D.collection('auditLogs').doc(),{by:U.email,action,...x,createdAt:TS});
const bal=p=>S.tx.filter(t=>t.pos==p).reduce((s,t)=>s+(t.type=='IN'?t.amount:-t.amount),0);
const sum=(p,y)=>S.tx.filter(t=>t.pos==p&&t.type==y).reduce((s,t)=>s+t.amount,0);
const mem=id=>S.mb.filter(m=>m.billId==id),stu=id=>S.st.find(s=>s.id==id)||{},pad=n=>String(n||0).padStart(2,'0');
/* tema */
const th=()=>{const p=localStorage.getItem('cc_t')||'sys';document.documentElement.dataset.t=p=='dark'||(p=='sys'&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'};th();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',th);
const setT=v=>{localStorage.setItem('cc_t',v);th();draw()};
/* periode Senin-Jumat */
const start=()=>new Date((S.cfg.startDate||'2026-11-09')+'T00:00:00'),curW=()=>Math.max(1,Math.floor((Date.now()-start())/(7*DAY))+1);
const fm=d=>d.toLocaleDateString('id-ID',{day:'numeric',month:'long'}),fr=n=>{const s=new Date(+start()+(n-1)*7*DAY),e=new Date(+s+4*DAY);return fm(s)+' - '+fm(e)+' '+e.getFullYear()};
const fdt=t=>t&&t.toDate?t.toDate().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'';
const fdd=t=>t&&t.toDate?t.toDate().toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}):'';
const wa=(ph,msg)=>{let p=(ph||'').replace(/\D/g,'');if(p[0]=='0')p='62'+p.slice(1);window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank')};

/* ---------- login ---------- */
const fe=c=>({'auth/invalid-email':'Format email tidak valid.','auth/wrong-password':'Email atau password salah.','auth/invalid-credential':'Email atau password salah.','auth/user-not-found':'Akun tidak ditemukan.','auth/email-already-in-use':'Email sudah terdaftar. Silakan masuk.','auth/weak-password':'Password minimal 6 karakter.','auth/missing-password':'Isi password.','auth/network-request-failed':'Koneksi bermasalah. Periksa internet.','auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi nanti.','auth/unauthorized-domain':'Domain belum diizinkan di Firebase.'}[c]||'Terjadi kesalahan. Coba lagi.');
function login(m){const t={in:['Masuk','Masuk ke akun kamu'],up:['Daftar','Buat akun baru'],rs:['Kirim link reset','Reset password']}[L];
app.innerHTML=`<div class="lg"><section class="bp"><i class="logo w"></i><h1>Kelola Kas Kelas, Lebih Mudah dan Transparan.</h1><p>Pantau kas mingguan, tunggakan, tagihan khusus, dan pengeluaran kelas dalam satu aplikasi yang aman.</p></section><section class="fp"><div class="glass fc"><i class="logo"></i><h1>${t[1]}</h1><p class="sm">Kelola Kas Kelas, Lebih Mudah dan Transparan.</p>
<label for="e">Email</label><input id="e" type="email" autocomplete="email" placeholder="nama@email.com">${L!='rs'?'<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter">':''}
<p class="msg" id="m" role="alert">${esc(m||'')}</p><button class="btn p w" id="go">${t[0]}</button>
<div class="or">atau</div><button class="btn w" id="g">Lanjutkan dengan Google</button>
<div class="lk">${L=='in'?'<a onclick="L=\'rs\';login()">Lupa password?</a><a onclick="L=\'up\';login()">Daftar akun</a>':'<a onclick="L=\'in\';login()">Kembali ke halaman masuk</a>'}</div>
<p class="sm sec">Data disimpan aman di Firebase. Akses dibatasi sesuai peran admin atau siswa.</p></div></section></div>`;
$('#go').onclick=async()=>{const b=$('#go'),e=$('#e').value.trim(),p=$('#p')?.value;b.disabled=true;b.textContent='Memproses...';try{if(L=='in')await A.signInWithEmailAndPassword(e,p);else if(L=='up'){const c=await A.createUserWithEmailAndPassword(e,p);await c.user.sendEmailVerification()}else{await A.sendPasswordResetEmail(e);L='in';return login('Link reset password dikirim ke email.')}}catch(x){b.disabled=false;b.textContent=t[0];$('#m').textContent=fe(x.code)}};
$('#g').onclick=()=>A.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(x=>x.code!='auth/popup-closed-by-user'&&($('#m').textContent=fe(x.code)))}
const scr=(t,m,b='')=>app.innerHTML=`<div class="ctr"><div class="glass fc"><i class="logo"></i><h1>${t}</h1><p class="sm" style="margin-bottom:16px">${m}</p><div class="stack">${b}<button class="btn w" onclick="A.signOut()">Keluar</button></div></div></div>`;

/* ---------- data realtime ---------- */
const sub=(q,k)=>un.push(q.onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,paid:0,...d.data()}));ready(k)},e=>toast(e.message)));
function ready(k){R.add(k);S.sync=new Date();if(R.size<(S.admin?6:3))return;if(S.admin&&!inited){inited=1;seed()}if(S.admin)ensure();draw()}
function subAdmin(){['students:st','weeklyDues:du','specialBills:sb','specialBillMembers:mb','transactions:tx'].forEach(x=>{const[c,k]=x.split(':');sub(D.collection(c),k)});un.push(D.doc('settings/main').onSnapshot(d=>{S.cfg=d.exists?d.data():{};ready('cfg')}))}
function subStu(e){sub(D.collection('weeklyDues').where('studentEmail','==',e),'du');sub(D.collection('specialBillMembers').where('studentEmail','==',e),'mb');un.push(D.doc('settings/main').onSnapshot(d=>{S.cfg=d.exists?d.data():{};ready('cfg')}))}
const NAMES='Andi Pratama,Budi Santoso,Citra Amelia,Dinda Putri,Eko Saputra,Farhan Akbar,Gabriella Putri,Hendra Wijaya,Intan Permata,Jonathan Samuel,Kevin Alexander,Livia Natalia,Michael Christian,Nadine Aurelia,Oscar Fernando,Putri Maharani,Rafael Jonathan,Salsabila Putri,Timothy Andreas,Vanessa Clarissa,William Sebastian'.split(','),GEN='LLPPLLPLPLLPLPLPLPLPL';
async function seed(){const b=D.batch();let n=0;if(!S.st.length){NAMES.forEach((x,i)=>b.set(D.collection('students').doc(),{name:x,no:i+1,gender:GEN[i],email:'',phone:'',active:true,joined:TS}));n++}if(!S.cfg.startDate){b.set(D.doc('settings/main'),{startDate:'2026-11-09',className:'Kelas',weeklyAmount:AMT},{merge:true});n++}if(n)await b.commit().catch(e=>toast(e.message))}
async function ensure(){if(ens||!S.st.length||!S.cfg.startDate)return;const have=new Set(S.du.map(x=>x.id)),b=D.batch();let n=0;for(let w=1;w<=curW();w++)S.st.filter(s=>s.active!==false).forEach(s=>{const id=w+'_'+s.id;if(!have.has(id)&&n<400){n++;b.set(D.doc('weeklyDues/'+id),{studentId:s.id,studentEmail:(s.email||'').toLowerCase(),name:s.name,no:s.no,week:w,amount:AMT,createdAt:TS},{merge:true})}});if(!n)return;ens=1;try{await b.commit()}catch(e){toast(e.message)}ens=0}
let dr=0;function draw(){if(dr)return;dr=1;requestAnimationFrame(()=>{dr=0;if(!U)return;const k={};document.querySelectorAll('input[id],select[id]').forEach(e=>k[e.id]=e.type=='checkbox'?e.checked:e.value);const f=document.activeElement?.id;(S.admin?render:renderStu)();Object.entries(k).forEach(([i,v])=>{const e=document.getElementById(i);if(!e)return;if(e.type=='checkbox'){if(i.startsWith('mc_'))e.checked=v}else e.value=v});if(f){const e=document.getElementById(f);if(e){e.focus();try{e.setSelectionRange(1e4,1e4)}catch(_){}}}})}
A.onAuthStateChanged(async u=>{U=u;un.forEach(f=>f());un=[];R=new Set();inited=0;S.admin=0;S.m=0;if(!u)return login();if(!u.emailVerified)return scr('Verifikasi email','Buka link verifikasi yang dikirim ke '+esc(u.email||'')+', lalu tekan tombol di bawah.','<button class="btn p w" onclick="U.reload().then(()=>U.getIdToken(true)).then(()=>location.reload())">Saya sudah verifikasi</button><button class="btn w" onclick="U.sendEmailVerification().then(()=>toast(\'Email dikirim ulang\'))">Kirim ulang email</button>');
try{const e=u.email.toLowerCase(),a=await D.doc('admins/'+e).get();if(a.exists&&a.data().aktif===true){S.admin=1;S.tab='dash';subAdmin()}else{const q=await D.collection('students').where('email','==',e).get();if(q.empty)return scr('Akun belum terhubung','Minta bendahara menambahkan email '+esc(e)+' ke data siswa.');S.me={id:q.docs[0].id,...q.docs[0].data()};S.tab='home';subStu(e)}}catch(x){scr('Gagal memuat data',esc(x.message))}});

/* ---------- transaksi ---------- */
const txd=(b,o)=>b.set(D.collection('transactions').doc(),{studentEmail:'',by:U.email,createdAt:TS,...o});
const payAlloc=(sid,amt)=>run(async()=>{const d=S.du.filter(x=>x.studentId==sid&&x.paid<x.amount&&x.week<=curW()).sort((a,b)=>a.week-b.week),ar=d.reduce((s,x)=>s+x.amount-x.paid,0);if(!(amt>0)||amt>ar)return toast('Nominal harus 1 sampai '+rp(ar));const b=D.batch();let r=amt;for(const x of d){if(r<=0)break;const t=Math.min(r,x.amount-x.paid);r-=t;b.update(D.doc('weeklyDues/'+x.id),{paid:INC(t),paidAt:TS});b.set(D.collection('weeklyPayments').doc(),{dueId:x.id,studentId:sid,studentEmail:x.studentEmail,week:x.week,amount:t,createdAt:TS});txd(b,{pos:'CASH_MAIN',type:'IN',kind:'kas',amount:t,name:x.name,studentEmail:x.studentEmail,week:x.week,note:'Kas minggu '+x.week})}aud(b,'bayar_kas',{studentId:sid,amount:amt});await b.commit();toast('Pembayaran dicatat');const e=$('#pa');if(e)e.value=''});

const correct=id=>run(async()=>{const x=S.du.find(d=>d.id==id),r=prompt('Alasan koreksi (wajib diisi)');if(!r){draw();return}const b=D.batch();b.update(D.doc('weeklyDues/'+id),{paid:0,paidAt:null});txd(b,{pos:'CASH_MAIN',type:'OUT',kind:'koreksi',amount:x.paid,name:x.name,studentEmail:x.studentEmail,week:x.week,note:'Koreksi kas minggu '+x.week+': '+r});aud(b,'koreksi_kas',{dueId:id,before:x.paid,after:0,reason:r});await b.commit();toast('Koreksi tercatat')});
const payM=(id,amt)=>run(async()=>{const x=S.mb.find(m=>m.id==id),r=x.amount-x.paid;if(!(amt>0)||amt>r)return toast('Nominal harus 1 sampai '+rp(r));const b=D.batch();b.update(D.doc('specialBillMembers/'+id),{paid:INC(amt)});b.set(D.collection('specialBillPayments').doc(),{billId:x.billId,memberId:id,studentEmail:x.studentEmail,amount:amt,createdAt:TS});txd(b,{pos:'SB:'+x.billId,type:'IN',kind:'tagihan',amount:amt,name:x.studentName,studentEmail:x.studentEmail,note:x.billName});aud(b,'bayar_tagihan',{memberId:id,amount:amt});await b.commit();toast('Pembayaran dicatat')});
const exp=(pos,col,n,a,extra)=>run(async()=>{if(!n||!(a>0))return toast('Isi nama dan nominal');if(a>bal(pos))return toast('Melebihi saldo '+rp(bal(pos)));const b=D.batch();b.set(D.collection(col).doc(),{name:n,amount:a,by:U.email,...extra,createdAt:TS});txd(b,{pos,type:'OUT',kind:'pengeluaran',amount:a,name:n,note:n});aud(b,'pengeluaran',{amount:a});await b.commit();toast('Pengeluaran dicatat')});
const saveSt=id=>run(async()=>{const n=$('#en').value.trim(),e=$('#ee').value.trim().toLowerCase();if(!n)return toast('Isi nama siswa');const o={name:n,gender:$('#eg').value,email:e,phone:$('#ep').value.trim()},b=D.batch();if(id){b.update(D.doc('students/'+id),o);S.du.filter(x=>x.studentId==id).forEach(x=>b.update(D.doc('weeklyDues/'+x.id),{studentEmail:e,name:n}));S.mb.filter(x=>x.studentId==id).forEach(x=>b.update(D.doc('specialBillMembers/'+x.id),{studentEmail:e,studentName:n}))}else b.set(D.collection('students').doc(),{...o,no:S.st.length?Math.max(...S.st.map(s=>s.no))+1:1,active:true,joined:TS});await b.commit();S.m=0;toast('Tersimpan')});
const delSt=id=>run(async()=>{if(!confirm('Hapus siswa ini? Riwayat pembayarannya tetap tersimpan.'))return;await D.doc('students/'+id).delete();S.m=0});
const mkBill=()=>run(async()=>{const n=$('#bn').value.trim(),a=+$('#ba').value,t=$('#bt').value,due=$('#bd').value,rs=$('#br').value;let l=S.st.filter(s=>s.active!==false);if(!n||!(a>0))return toast('Isi nama dan nominal');if(t=='L'||t=='P')l=l.filter(s=>s.gender==t);if(t=='M'){const ck=[...document.querySelectorAll('[id^=mc_]:checked')].map(x=>x.id.slice(3));l=l.filter(s=>ck.includes(s.id))}if(!l.length)return toast('Tidak ada siswa terpilih');const r=D.collection('specialBills').doc(),b=D.batch();b.set(r,{name:n,reason:rs,desc:$('#bx').value,amount:a,target:t,due,status:'Aktif',createdAt:TS});l.forEach(s=>b.set(D.collection('specialBillMembers').doc(),{billId:r.id,billName:n,reason:rs,dueDate:due,amount:a,paid:0,studentId:s.id,studentEmail:(s.email||'').toLowerCase(),studentName:s.name,createdAt:TS}));aud(b,'buat_tagihan',{billId:r.id});await b.commit();S.m=0;toast('Tagihan dibuat')});

function dash(){const w=curW(),d=S.du.filter(x=>x.week==w),tg=d.reduce((s,x)=>s+x.amount,0),tp=d.reduce((s,x)=>s+x.paid,0),pc=tg?Math.round(tp/tg*100):0,old=S.du.filter(x=>x.week<w).reduce((s,x)=>s+x.amount-x.paid,0),sbDue=S.mb.reduce((s,x)=>s+x.amount-x.paid,0),ws=[];for(let i=Math.max(1,w-5);i<=w;i++)ws.push(i);

function memM(id){const x=S.mb.find(m=>m.id==id);if(!x)return'';const r=x.amount-x.paid;return`<div class="row"><div class="av">${ic('user')}</div><div class="g1"><h2>${esc(x.studentName)}</h2><p class="sm">${esc(x.billName)}</p></div>${chip(x)}<button class="btn s" onclick="cm()" aria-label="Tutup">${ic('x')}</button></div><div class="g3"><div class="mini"><b class="num">${rp(x.amount)}</b><span>Tagihan</span></div><div class="mini"><b class="num">${rp(x.paid)}</b><span>Dibayar</span></div><div class="mini"><b class="num">${rp(r)}</b><span>Sisa</span></div></div>${r?`<label for="pm">Nominal pembayaran</label><input id="pm" type="number" inputmode="numeric" placeholder="Maks ${rp(r)}"><div class="row w" style="margin-top:8px"><button class="btn p" onclick="payM('${id}',+$('#pm').value)">Catat</button><button class="btn" onclick="payM('${id}',${r})">Lunasi</button></div><button class="btn w" style="margin-top:10px" onclick="wa(stu('${x.studentId}').phone,'Halo ${esc(x.studentName.split(' ')[0])}, mengingatkan bahwa tagihan ${esc(x.billName)} sebesar ${rp(r)} masih belum dibayar. Mohon segera melakukan pembayaran. Terima kasih.')">${ic('wa')}Ingatkan lewat WhatsApp</button>`:''}`}
function out(){return`<div class="card glass"><h2>Catat pengeluaran</h2><p class="sm">Saldo kas utama ${rp(bal('CASH_MAIN'))}</p><label for="en">Nama pengeluaran</label><input id="en"><label for="ea">Nominal</label><input id="ea" type="number" inputmode="numeric"><label for="ec">Kategori</label><input id="ec" placeholder="Contoh: Perlengkapan"><button class="btn p w" style="margin-top:14px" onclick="exp('CASH_MAIN','cashExpenses',$('#en').value.trim(),+$('#ea').value,{category:$('#ec').value})">Simpan pengeluaran</button></div><div class="card glass">${S.tx.filter(t=>t.pos=='CASH_MAIN'&&t.kind=='pengeluaran').sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(txr).join('')||'<p class="sm">Belum ada pengeluaran.</p>'}</div>`}
function log(){const f=S.f||'all',lm=S.lm||'',l=S.tx.filter(t=>(f=='all'||(f=='kas'?t.pos=='CASH_MAIN'&&t.kind!='koreksi':f=='sb'?t.pos.startsWith('SB:'):t.kind=='koreksi'))&&(!lm||(t.createdAt?.toDate?.().toISOString().slice(0,7)==lm))).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
return`<div class="row w" style="margin-bottom:16px"><select id="lf" onchange="S.f=this.value;draw()" style="margin:0">${[['all','Semua'],['kas','Kas utama'],['sb','Tagihan khusus'],['kr','Koreksi']].map(x=>`<option value="${x[0]}" ${f==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><input id="lm" type="month" value="${lm}" onchange="S.lm=this.value;draw()" style="margin:0"></div><div class="card glass">${l.map(t=>txr(t).replace('<p class="sm">','<p class="sm">#'+t.id.slice(0,6)+' - ')).join('')||'<p class="sm">Tidak ada transaksi.</p>'}</div>`}

/* ---------- akun & pengaturan ---------- */
function akun(){const adm=S.admin,nm=adm?(U.displayName||'Admin'):S.me.name,pt=localStorage.getItem('cc_t')||'sys';
return`<div class="card glass"><div class="row" style="justify-content:flex-start;gap:16px"><div class="av l">${esc(nm[0]||'A')}</div><div class="g1"><h2>${esc(nm)}</h2><p class="sm">${esc(U.email)}</p><span class="chip ok">${adm?'Admin':'Siswa'}</span></div></div>
<div class="item" style="margin-top:16px"><span class="sm">ID akun</span><span class="num sm">${U.uid.slice(0,10)}</span></div><div class="item"><span class="sm">Status</span><b>Aktif</b></div><div class="item"><span class="sm">Bergabung</span><b>${new Date(U.metadata.creationTime).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</b></div>
<div class="row w" style="margin-top:14px"><button class="btn" onclick="run(async()=>{const n=prompt('Nama tampilan',U.displayName||'');if(n){await U.updateProfile({displayName:n});draw()}})">Edit profil</button><button class="btn" onclick="A.sendPasswordResetEmail(U.email).then(()=>toast('Link ubah password dikirim ke email'))">Ubah password</button></div></div>
<div class="card glass"><h2 style="margin-bottom:12px">Tampilan</h2><div class="seg">${[['sys','Sistem'],['light','Terang'],['dark','Gelap']].map(x=>`<button class="${pt==x[0]?'on':''}" onclick="setT('${x[0]}')">${x[1]}</button>`).join('')}</div></div>
${adm?`<div class="card glass"><h2>Kelas</h2><label for="cn">Nama kelas</label><input id="cn" value="${esc(S.cfg.className||'')}"><label for="cs">Nama sekolah</label><input id="cs" value="${esc(S.cfg.school||'')}"><label for="ct">Nama bendahara</label><input id="ct" value="${esc(S.cfg.treasurer||'')}"><label for="cd">Senin pertama (awal minggu 1)</label><input id="cd" type="date" value="${S.cfg.startDate||''}"><p class="sm">Kas tetap Rp5.000 per siswa per minggu, Senin sampai Jumat.</p><button class="btn p w" style="margin-top:12px" onclick="saveCfg()">Simpan pengaturan kelas</button></div>
<div class="card glass"><h2 style="margin-bottom:8px">Menu lain</h2><div class="stack"><button class="btn w" onclick="S.tab='out';draw()">${ic('out')}Pengeluaran kas</button><button class="btn w" onclick="S.tab='log';draw()">${ic('list')}Riwayat transaksi</button></div></div>`:''}
<div class="card glass"><h2 style="margin-bottom:8px">Data</h2><div class="item"><span class="sm">Koneksi Firebase</span><span class="chip ${navigator.onLine?'ok':'er'}">${navigator.onLine?'Terhubung':'Offline'}</span></div><div class="item"><span class="sm">Sinkron terakhir</span><b>${S.sync?S.sync.toLocaleTimeString('id-ID'):'-'}</b></div></div>
<div class="card glass"><h2>Tentang ClassCash</h2><p class="sm" style="margin-top:6px">Versi 2.0. Kelola Kas Kelas, Lebih Mudah dan Transparan. Data tersimpan di Firebase dan dilindungi aturan akses sesuai peran.</p></div>
<button class="btn w" onclick="A.signOut()">${ic('lo')}Keluar</button>`}

/* ---------- tampilan siswa ---------- */
function renderStu(){const w=curW(),d=[...S.du].filter(x=>x.week<=w).sort((a,b)=>a.week-b.week),c=d.find(x=>x.week==w),ar=d.filter(x=>x.paid<x.amount).reduce((s,x)=>s+x.amount-x.paid,0);
const V=S.tab=='akun'?akun():`<div class="card glass hero"><span class="sm">Kas minggu ${w} (${fr(w)})</span>${c?`<b class="num">${c.paid>=c.amount?'Lunas':'Sisa '+rp(c.amount-c.paid)}</b><span class="sm">Dibayar ${rp(c.paid)} dari ${rp(c.amount)}</span>`:'<b class="num">Belum ada tagihan</b>'}</div>
<div class="grid"><div class="card glass"><span class="sm">Total dibayar</span><b class="num">${rp(d.reduce((s,x)=>s+x.paid,0))}</b></div><div class="card glass"><span class="sm">Tunggakan</span><b class="num">${rp(ar)}</b></div></div>
<div class="card glass"><h2 style="margin-bottom:12px">Riwayat kas mingguan</h2>${[...d].reverse().map(x=>`<div class="item"><div class="g1"><b>Minggu ${x.week}</b><p class="sm">${fr(x.week)}${x.paid>=x.amount&&x.paidAt?' - Dibayar '+fdt(x.paidAt):''}</p></div>${chip(x)}</div>`).join('')||'<p class="sm">Belum ada riwayat.</p>'}</div>
<div class="card glass"><h2 style="margin-bottom:12px">Tagihan khusus</h2>${S.mb.map(x=>`<div class="item"><div class="g1"><b>${esc(x.billName)}</b><p class="sm">${esc(x.reason)}${x.dueDate?' - batas '+esc(x.dueDate):''}</p><p class="sm">${rp(x.paid)} dari ${rp(x.amount)}, sisa ${rp(x.amount-x.paid)}</p></div>${chip(x)}</div>`).join('')||'<p class="sm">Tidak ada tagihan khusus untukmu.</p>'}</div>`;
app.innerHTML=`<div class="shell">${nav([['home','home','Beranda',1],['akun','gear','Akun',1]],k=>`S.tab='${k}';draw()`)}<main><div class="hd"><div class="mo"><i class="logo"></i></div><div class="g1"><h1>${S.tab=='akun'?'Akun':'Halo, '+esc(S.me.name.split(' ')[0])}</h1><p class="sm">${S.tab=='akun'?'Profil dan pengaturan':'Kas kelas kamu'}</p></div></div>${V}</main></div>`}
</script></body></html>
